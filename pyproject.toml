[project]
name = "automation-project-tracker"
version = "0.1.0"
description = "Data pipeline that turns the automation project Excel tracker into JSON for the dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
]

[project.scripts]
create-html = "pipeline.create_html:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
